name: Windows (testes e EditaLote.exe)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # para publicar a versão (Release) quando uma tag v* é enviada

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Testes
        run: python -m pytest -v

      - name: Gerar EditaLote.exe
        run: >
          pyinstaller editalote_app.py --name EditaLote --noconfirm --onedir
          --add-data "editalote/estatico;editalote/estatico"
          --hidden-import tkinter --hidden-import tkinter.filedialog

      - name: Montar a pasta para download
        shell: pwsh
        run: |
          Copy-Item -Recurse presets dist/EditaLote/presets
          Copy-Item README.md dist/EditaLote/LEIA-ME.md

      - name: Testar o .exe (processa fotos de verdade)
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); from test_editalote import foto_teste; import os; os.makedirs('amostra', exist_ok=True); [foto_teste(f'amostra/IMG_{i:04d}.jpg', data=f'2026:09:20 18:{i:02d}:00', tamanho=(3000, 2000)) for i in range(12)]"
          ./dist/EditaLote/EditaLote.exe processar amostra saida --preset presets/01-natural.json --prefixo Teste
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $n = (Get-ChildItem saida -Filter *.jpg).Count
          Write-Host "Fotos geradas: $n"
          if ($n -ne 12) { exit 1 }

      - name: Testar a tela do .exe
        shell: pwsh
        run: |
          $p = Start-Process ./dist/EditaLote/EditaLote.exe -ArgumentList "tela","--sem-navegador" -PassThru
          Start-Sleep -Seconds 8
          $r = Invoke-WebRequest http://127.0.0.1:8765/api/presets -UseBasicParsing
          Write-Host $r.Content.Substring(0, 120)
          $h = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
          if (-not $h.Content.Contains("EditaLote")) { exit 1 }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: EditaLote-Windows
          path: dist/EditaLote

      # Tag v1.2.3 -> versão oficial com link fixo:
      # https://github.com/<dono>/<repo>/releases/latest/download/EditaLote-Windows.zip
      - name: Compactar para a versão oficial
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/EditaLote -DestinationPath EditaLote-Windows.zip

      - name: Publicar versão oficial
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EditaLote-Windows.zip
          generate_release_notes: true
