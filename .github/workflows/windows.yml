name: Windows (testes e EditaLote.exe)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      versao:
        description: "Publicar como versão oficial (ex.: v0.3.0). Vazio = só testar."
        required: false
        default: ""

permissions:
  contents: write  # para publicar a versão (Release)

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Testes
        run: python -m pytest -v

      - name: Gerar EditaLote.exe
        run: >
          pyinstaller editalote_app.py --name EditaLote --noconfirm --onedir --windowed
          --icon editalote/estatico/marca/icone.ico
          --add-data "editalote/estatico;editalote/estatico"
          --collect-all webview
          --hidden-import tkinter --hidden-import tkinter.filedialog

      - name: Montar a pasta para download
        shell: pwsh
        run: |
          Copy-Item -Recurse presets dist/EditaLote/presets
          Copy-Item README.md dist/EditaLote/LEIA-ME.md

      - name: Testar o .exe (processa fotos de verdade)
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); from test_editalote import foto_teste; import os; os.makedirs('amostra', exist_ok=True); [foto_teste(f'amostra/IMG_{i:04d}.jpg', data=f'2026:09:20 18:{i:02d}:00', tamanho=(3000, 2000)) for i in range(12)]"
          # programa sem console: Start-Process -Wait para esperar e pegar o código de saída
          $p = Start-Process ./dist/EditaLote/EditaLote.exe -ArgumentList @("processar", "amostra", "saida", "--preset", "presets/01-natural.json", "--prefixo", "Teste") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "Código de saída: $($p.ExitCode)"; exit 1 }
          $n = (Get-ChildItem saida -Filter *.jpg).Count
          Write-Host "Fotos geradas: $n"
          if ($n -ne 12) { exit 1 }

      - name: Testar a janela do programa
        shell: pwsh
        run: |
          $p = Start-Process ./dist/EditaLote/EditaLote.exe -ArgumentList @("janela", "--porta", "8770") -PassThru
          Start-Sleep -Seconds 15
          $log = "dist/EditaLote/editalote.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.HasExited) { Write-Host "O programa fechou sozinho (código $($p.ExitCode))"; exit 1 }
          $h = Invoke-WebRequest http://127.0.0.1:8770/ -UseBasicParsing
          if (-not $h.Content.Contains("Durães Fotografia")) { exit 1 }
          $js = Invoke-WebRequest http://127.0.0.1:8770/estatico/app.js -UseBasicParsing
          if ($js.StatusCode -ne 200) { exit 1 }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "janela nativa indisponível" -Quiet)) {
            Write-Host "::warning::A janela nativa não abriu neste Windows; o programa usou o navegador."
          }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: EditaLote-Windows
          path: dist/EditaLote

      # Tag v1.2.3 (ou execução manual com "versao") -> versão oficial com link fixo:
      # https://github.com/<dono>/<repo>/releases/latest/download/EditaLote-Windows.zip
      - name: Compactar para a versão oficial
        if: startsWith(github.ref, 'refs/tags/v') || inputs.versao != ''
        shell: pwsh
        run: Compress-Archive -Path dist/EditaLote -DestinationPath EditaLote-Windows.zip

      - name: Publicar versão oficial
        if: startsWith(github.ref, 'refs/tags/v') || inputs.versao != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.versao || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: EditaLote ${{ inputs.versao || github.ref_name }}
          files: EditaLote-Windows.zip
          generate_release_notes: true
