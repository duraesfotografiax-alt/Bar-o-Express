name: Windows (testes e DuraesApp.exe)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      versao:
        description: "Publicar como versão oficial (ex.: v0.3.0). Vazio = só testar."
        required: false
        default: ""

permissions:
  contents: write  # para publicar a versão (Release)

jobs:
  # Modelo de IA para "Remover objeto" (LaMa, licença Apache-2.0), baixado do Hugging Face
  modelo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o modelo LaMa (ONNX)
        run: |
          mkdir -p modelo
          curl -sSL https://huggingface.co/api/models/Carve/LaMa-ONNX > modelo/lista.json || true
          cat modelo/lista.json | head -c 3000; echo
          curl -fSL -o modelo/lama_fp32.onnx https://huggingface.co/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx
          ls -la modelo
          sha256sum modelo/lama_fp32.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: modelo-lama
          path: modelo
          retention-days: 30
      - uses: actions/checkout@v4
        with:
          path: codigo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar o Remover objeto com o modelo
        working-directory: codigo
        env:
          DURAES_MODELO_LAMA: ${{ github.workspace }}/modelo/lama_fp32.onnx
        run: |
          pip install -q -r requirements.txt
          python scripts/testar_remover.py | tee resultados_log.txt
      - name: Guardar o resultado do teste (branch ci-resultados)
        working-directory: codigo
        run: |
          mkdir -p /tmp/res && cp resultados/* resultados_log.txt /tmp/res/
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-resultados && git rm -rfq . && cp /tmp/res/* . 
          git add -A && git commit -qm "resultado do teste do Remover objeto (${GITHUB_SHA::7})"
          git push -f origin ci-resultados

  windows:
    runs-on: windows-latest
    env:
      # nos testes do .exe os dados ficam na própria pasta (os testes conferem os arquivos lá)
      DURAES_DADOS: ${{ github.workspace }}\dist\DuraesApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Testes
        run: python -m pytest -v

      - name: Gerar DuraesApp.exe
        run: >
          pyinstaller editalote_app.py --name DuraesApp --noconfirm --onedir --windowed
          --icon editalote/estatico/marca/icone.ico
          --add-data "editalote/estatico;editalote/estatico"
          --collect-all webview --collect-binaries onnxruntime
          --hidden-import tkinter --hidden-import tkinter.filedialog

      - name: Baixar o modelo de IA do Remover objeto (LaMa)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/DuraesApp/modelos | Out-Null
          Invoke-WebRequest -Uri https://huggingface.co/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx -OutFile dist/DuraesApp/modelos/lama_fp32.onnx
          (Get-Item dist/DuraesApp/modelos/lama_fp32.onnx).Length

      - name: Montar a pasta para download
        shell: pwsh
        run: |
          Copy-Item -Recurse presets dist/DuraesApp/presets
          Copy-Item README.md dist/DuraesApp/LEIA-ME.md

      - name: Testar o .exe (processa fotos de verdade)
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); from test_editalote import foto_teste; import os; os.makedirs('amostra', exist_ok=True); [foto_teste(f'amostra/IMG_{i:04d}.jpg', data=f'2026:09:20 18:{i:02d}:00', tamanho=(3000, 2000)) for i in range(12)]"
          # programa sem console: Start-Process -Wait para esperar e pegar o código de saída
          $p = Start-Process ./dist/DuraesApp/DuraesApp.exe -ArgumentList @("processar", "amostra", "saida", "--preset", "presets/01-natural.json", "--prefixo", "Teste") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "Código de saída: $($p.ExitCode)"; exit 1 }
          $n = (Get-ChildItem saida -Filter *.jpg).Count
          Write-Host "Fotos geradas: $n"
          if ($n -ne 12) { exit 1 }

      - name: Testar a IA dentro do .exe (aprender estilo)
        shell: pwsh
        run: |
          # metade com a edição dentro do JPEG, metade com .xmp ao lado (como o Lightroom exporta)
          python -c "import sys, pathlib; sys.path.insert(0, 'tests'); from test_estilo_ia import evento; p = pathlib.Path('exportado'); p.mkdir(); evento(p, 30, semente=1); q = p / 'sidecar'; q.mkdir(); evento(q, 30, semente=2, sidecar=True)"
          $p = Start-Process ./dist/DuraesApp/DuraesApp.exe -ArgumentList @("aprender", "exportado", "--nome", "EstiloTeste", "--modo", "lightroom") -Wait -PassThru
          Get-Content dist/DuraesApp/duraesapp.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Host "Código de saída: $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path dist/DuraesApp/presets/estilos/estiloteste.json)) { Write-Host "Modelo não foi salvo"; exit 1 }
          $preset = Get-Content dist/DuraesApp/presets/estiloteste.json -Raw | ConvertFrom-Json
          if ($preset.estilo_ia -ne "estilos/estiloteste.json") { exit 1 }
          # usa o estilo aprendido para editar as fotos
          $p = Start-Process ./dist/DuraesApp/DuraesApp.exe -ArgumentList @("processar", "amostra", "saida-ia", "--preset", "dist/DuraesApp/presets/estiloteste.json") -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if ((Get-ChildItem saida-ia -Filter *.jpg).Count -ne 12) { exit 1 }
          Get-Content saida-ia/relatorio.csv -TotalCount 4
          Remove-Item -Recurse dist/DuraesApp/presets/estilos, dist/DuraesApp/presets/estiloteste.json, dist/DuraesApp/duraesapp.log

      - name: Testar a IA por referência dentro do .exe (fotos finais)
        shell: pwsh
        run: |
          # as fotos editadas no passo anterior servem de "fotos finais entregues"
          $p = Start-Process ./dist/DuraesApp/DuraesApp.exe -ArgumentList @("aprender", "saida", "--nome", "Referencia", "--modo", "referencia") -Wait -PassThru
          Get-Content dist/DuraesApp/duraesapp.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
          $p = Start-Process ./dist/DuraesApp/DuraesApp.exe -ArgumentList @("processar", "amostra", "saida-ref", "--preset", "dist/DuraesApp/presets/referencia.json") -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if ((Get-ChildItem saida-ref -Filter *.jpg).Count -ne 12) { exit 1 }
          Get-Content saida-ref/relatorio.csv -TotalCount 3
          Remove-Item dist/DuraesApp/presets/referencia.json, dist/DuraesApp/duraesapp.log

      - name: Testar a IA por pares dentro do .exe (originais + finais)
        shell: pwsh
        run: |
          # "saida" foi renomeada (prefixo Teste): os pares são achados pela data/hora da foto
          $p = Start-Process ./dist/DuraesApp/DuraesApp.exe -ArgumentList @("aprender", "amostra", "--finais", "saida", "--nome", "Pares", "--modo", "pares") -Wait -PassThru
          Get-Content dist/DuraesApp/duraesapp.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
          $p = Start-Process ./dist/DuraesApp/DuraesApp.exe -ArgumentList @("processar", "amostra", "saida-pares", "--preset", "dist/DuraesApp/presets/pares.json") -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if ((Get-ChildItem saida-pares -Filter *.jpg).Count -ne 12) { exit 1 }
          Get-Content saida-pares/relatorio.csv -TotalCount 3
          Remove-Item -Recurse dist/DuraesApp/presets/estilos, dist/DuraesApp/presets/pares.json, dist/DuraesApp/duraesapp.log

      - name: Testar o Remover objeto (IA) dentro do .exe
        shell: pwsh
        run: |
          '{"nome": "Remover", "auto_exposicao": 0, "auto_balanco_branco": 0, "remover": [{"p": [[0.5, 0.4], [0.5, 0.6]], "r": 0.06}]}' | Out-File -Encoding utf8 remover.json
          $p = Start-Process ./dist/DuraesApp/DuraesApp.exe -ArgumentList @("processar", "amostra", "saida-remover", "--preset", "remover.json", "--processos", "2") -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if ((Get-ChildItem saida-remover -Filter *.jpg).Count -ne 12) { exit 1 }
          $p = Start-Process ./dist/DuraesApp/DuraesApp.exe -ArgumentList @("_testar_ia", "--saida", "ia.txt") -Wait -PassThru
          Get-Content ia.txt
          if ($p.ExitCode -ne 0) { Write-Host "O modelo de IA não carregou no .exe"; exit 1 }

      - name: Testar a janela do programa e a ligação com a tela
        shell: pwsh
        run: |
          $log = "dist/DuraesApp/duraesapp.log"
          # autoteste: abre a janela de verdade, confere se a tela enxerga a API e fecha
          $p = Start-Process ./dist/DuraesApp/DuraesApp.exe -ArgumentList @("janela", "--autoteste") -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; Write-Host "Autoteste travou"; Get-Content $log -ErrorAction SilentlyContinue; exit 1 }
          Get-Content $log -ErrorAction SilentlyContinue
          if (Select-String -Path $log -Pattern "janela nativa indisponível" -Quiet) {
            Write-Host "::warning::A janela nativa não abriu neste Windows; o programa usou o navegador."
          } elseif (-not (Select-String -Path $log -Pattern "autoteste api.escolher=function" -Quiet)) {
            Write-Host "A tela não enxerga a API da janela"; exit 1
          }
          Remove-Item $log
          # a tela completa responde com a marca nova
          $p = Start-Process ./dist/DuraesApp/DuraesApp.exe -ArgumentList @("janela", "--porta", "8770") -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Host "O programa fechou sozinho (código $($p.ExitCode))"; exit 1 }
          $h = Invoke-WebRequest http://127.0.0.1:8770/ -UseBasicParsing
          if (-not $h.Content.Contains("Durães APP")) { exit 1 }
          $js = Invoke-WebRequest http://127.0.0.1:8770/estatico/app.js -UseBasicParsing
          if ($js.StatusCode -ne 200) { exit 1 }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2
          Remove-Item $log -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: DuraesApp-Windows
          path: dist/DuraesApp

      # Tag v1.2.3 (ou execução manual com "versao") -> versão oficial com link fixo:
      # https://github.com/<dono>/<repo>/releases/latest/download/DuraesApp-Windows.zip
      # (também publicado como EditaLote-Windows.zip para o link antigo continuar funcionando)
      - name: Compactar para a versão oficial
        if: startsWith(github.ref, 'refs/tags/v') || inputs.versao != ''
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DuraesApp -DestinationPath DuraesApp-Windows.zip
          Copy-Item DuraesApp-Windows.zip EditaLote-Windows.zip

      - name: Publicar versão oficial
        if: startsWith(github.ref, 'refs/tags/v') || inputs.versao != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.versao || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Durães APP ${{ inputs.versao || github.ref_name }}
          files: |
            DuraesApp-Windows.zip
            EditaLote-Windows.zip
          generate_release_notes: true
